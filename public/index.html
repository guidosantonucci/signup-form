<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create your account | Signup Form</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>Create your account</h1>

    <form id="signup" novalidate aria-describedby="form-hint">
      <p id="form-hint" class="hint">All fields are required.</p>

      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" autocomplete="name" aria-describedby="fullName-error" />
        <p id="fullName-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error" />
        <p id="email-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               aria-describedby="password-rules password-error" />
        <p id="password-rules" class="hint">At least 8 characters, with an uppercase letter, a number and a symbol.</p>
        <div class="meter" aria-hidden="true"><span id="strength-bar"></span></div>
        <p class="hint">Strength: <span id="strength-label" data-testid="strength-label">—</span></p>
        <p id="password-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"
               aria-describedby="confirmPassword-error" />
        <p id="confirmPassword-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="birthDate">Date of birth</label>
        <input id="birthDate" name="birthDate" type="date" aria-describedby="birthDate-error" />
        <p id="birthDate-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="country">Country</label>
        <select id="country" name="country" aria-describedby="country-error">
          <option value="">Select a country</option>
          <option value="AR">Argentina</option>
          <option value="BR">Brazil</option>
          <option value="CA">Canada</option>
          <option value="ES">Spain</option>
          <option value="US">United States</option>
        </select>
        <p id="country-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field checkbox">
        <input id="terms" name="terms" type="checkbox" aria-describedby="terms-error" />
        <label for="terms">I accept the terms and conditions</label>
        <p id="terms-error" class="error" aria-live="polite"></p>
      </div>

      <button type="submit">Create account</button>
    </form>

    <section id="success" hidden tabindex="-1" aria-labelledby="success-title">
      <h2 id="success-title">Welcome aboard!</h2>
      <p>We sent a confirmation link to <strong id="success-email"></strong>.</p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
